name: Morning newsroom
# Supabase Cron is the sole timer. This workflow remains a manual recovery path.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsroom-ingestion
  cancel-in-progress: false
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTENT_OS_MODE: supabase
      CONTENT_OS_DATA_MODE: live
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify runtime configuration
        run: node -e 'if (!process.env.NEXT_PUBLIC_SUPABASE_URL || !process.env.SUPABASE_SECRET_KEY) throw Error("Supabase runtime secrets missing")'
      - run: node node_modules/tsx/dist/cli.mjs scripts/automation.ts
